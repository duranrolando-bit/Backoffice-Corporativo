<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reemplazos de Sim</title>
  <link rel="stylesheet" href="sidebar.css">
  <script src="sidebar.js" defer></script>
<style>

body{
    font-family: Arial, sans-serif;
    margin:20px;
    background:#f5f5f5;
}

h2{
    color:#333;
}

textarea{
    width:100%;
    padding:10px;
    box-sizing:border-box;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
    background:white;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
}

th{
    background:#0078d7;
    color:white;
}

input{
    width:100%;
    padding:6px;
    box-sizing:border-box;
}

button{
    padding:10px 15px;
    margin-top:10px;
    margin-right:5px;
    background:#0078d7;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#005ea6;
}

#comentarios{
    margin-top:20px;
    height:250px;
}
</style>
</head>
<body>
<h2>Datos de Teléfono y Nuevo SIM</h2>
<h2>PVEXT.040</h2>

<textarea id="datos" rows="8" placeholder="Pegue aquí los datos:
50376034123 895030122508071368
50360629847 895030122508071369"></textarea>

<br>
<button onclick="generarTabla()">Generar Tabla</button>

<div id="contenedorTabla"></div>

<textarea id="comentarios" readonly placeholder="Aquí aparecerán los comentarios generados"></textarea>

<script>

function generarTabla() {

    const texto = document.getElementById("datos").value.trim();

    if(!texto){
        alert("Ingrese información en el área de texto.");
        return;
    }

    const lineas = texto.split("\n");

    let html = `
    <table>
        <thead>
            <tr>
                <th>Teléfono</th>
                <th>Nuevo SIM</th>
                <th>SIM Anterior</th>
            </tr>
        </thead>
        <tbody>
    `;

    lineas.forEach(linea => {

        const partes = linea.trim().split(/\s+/);

        if(partes.length >= 2){

            html += `
            <tr>
                <td>${partes[0]}</td>
                <td>${partes[1]}</td>
                <td>
                    <input type="text" class="simAnterior">
                </td>
            </tr>
            `;
        }
    });

    html += `
        </tbody>
    </table>

    <button onclick="generarComentarios()">
        Generar Comentarios
    </button>
    `;

    document.getElementById("contenedorTabla").innerHTML = html;
}

function generarComentarios(){

    const filas = document.querySelectorAll("tbody tr");

    let resultado = [];

    filas.forEach(fila => {

        const telefono = fila.cells[0].innerText;
        const nuevoSim = fila.cells[1].innerText;
        const simAnterior = fila.querySelector(".simAnterior").value.trim();

        if(simAnterior !== ""){
            resultado.push(
                `Se realiza reemplazo de SIM al número ${telefono} con nuevo SIM ${nuevoSim} y se retira anterior SIM ${simAnterior}`
            );
        }
    });

    document.getElementById("comentarios").value = resultado.join("\n");
}

</script>

</body>
</html>
