<h2>Datos de Teléfono y Nuevo SIM</h2>
<h2>PVEXT.040</h2>

<textarea id="datos" rows="8" placeholder="Pegue aquí los datos:
50376034123 895030122508071368
50360629847 895030122508071369"></textarea>

<br>
<button onclick="generarTabla()">Generar Tabla</button>

<div id="contenedorTabla"></div>

<textarea id="comentarios" readonly placeholder="Aquí aparecerán los comentarios generados"></textarea>

<script>

function generarTabla() {

    const texto = document.getElementById("datos").value.trim();

    if(!texto){
        alert("Ingrese información en el área de texto.");
        return;
    }

    const lineas = texto.split("\n");

    let html = `
    <table>
        <thead>
            <tr>
                <th>Teléfono</th>
                <th>Nuevo SIM</th>
                <th>SIM Anterior</th>
            </tr>
        </thead>
        <tbody>
    `;

    lineas.forEach(linea => {

        const partes = linea.trim().split(/\s+/);

        if(partes.length >= 2){

            html += `
            <tr>
                <td>${partes[0]}</td>
                <td>${partes[1]}</td>
                <td>
                    <input type="text" class="simAnterior">
                </td>
            </tr>
            `;
        }
    });

    html += `
        </tbody>
    </table>

    <button onclick="generarComentarios()">
        Generar Comentarios
    </button>
    `;

    document.getElementById("contenedorTabla").innerHTML = html;
}

function generarComentarios(){

    const filas = document.querySelectorAll("tbody tr");

    let resultado = [];

    filas.forEach(fila => {

        const telefono = fila.cells[0].innerText;
        const nuevoSim = fila.cells[1].innerText;
        const simAnterior = fila.querySelector(".simAnterior").value.trim();

        if(simAnterior !== ""){
            resultado.push(
                `Se realiza reemplazo de SIM al número ${telefono} con nuevo SIM ${nuevoSim} y se retira anterior SIM ${simAnterior}`
            );
        }
    });

    document.getElementById("comentarios").value = resultado.join("\n");
}

</script>

</body>
