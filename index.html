<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directorio Corporativo Claro</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:20px;
    background:#f5f5f5;
}

h1{
    text-align:center;
    color:#d52b1e;
    margin-bottom:20px;
}

#buscador{
    width:100%;
    max-width:600px;
    margin:0 auto 25px;
    display:block;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.contenedor{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:20px;
}

.card{
    background:#fff;
    border-radius:15px;
    padding:18px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.segmento{
    background:#ff0000;
    color:white;
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:10px;
}

.segmento2{
    background:#0000ff;
    color:white;
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:10px;
}

.segmento3{
    background:#007700;
    color:white;
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:10px;
}

.segmento4{
    background:#9b1ed5;
    color:white;
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:10px;
}

.segmento5{
    background:#005f57;
    color:white;
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:10px;
}

.nombre{
    font-size:20px;
    font-weight:bold;
    color:#333;
    margin-bottom:10px;
}

.info{
    margin-bottom:8px;
    color:#555;
}

.botones{
    margin-top:15px;
    display:flex;
    gap:10px;
}

.btn{
    flex:1;
    text-align:center;
    color:white;
    text-decoration:none;
    padding:10px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
}

.llamar{
    background:#28a745;
}

.correo{
    background:#007bff;
}

.menu{
    background:#000000;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo a{
    color:white;
    text-decoration:none;
    font-size:24px;
    font-weight:bold;
}

.menu ul{
    list-style:none;
    display:flex;
}

.menu ul li{
    margin-left:20px;
}

.menu ul li a{
    color:white;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

.menu ul li a:hover{
    color:#f1c40f;
}

@media(max-width:768px){
    .menu{
        flex-direction:column;
    }

    .menu ul{
        margin-top:10px;
        flex-direction:column;
        text-align:center;
    }

    .menu ul li{
        margin:10px 0;
    }
}

</style>
</head>
