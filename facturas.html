<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Comentarios de Factura</title>
    <link rel="stylesheet" href="styles.css">    
</head>
<body>

<nav class="menu">
    <div class="logo">
        <a href="facturas.html">Facturas</a>
    </div>

    <ul>
        <li><a href="directorio_posventas.html">Directorio de Posventas</a></li>
        <li><a href="enlaces.html">Enlaces</a></li>
        <li><a href="reemplazo_sim.html">Reemplazos de SIM</a></li>
        <li><a href="firmador_automatico_robo.html">Firma en Reporte de Robo</a></li>
        <li><a href="facturas.html">Facturas</a></li>
    </ul>
</nav>

<div class="contenedor">
    <h1>Generador de Comentarios</h1>

    <label>Nombre de la Empresa</label>
    <input type="text" id="empresa" placeholder="Ingrese el nombre de la empresa">

    <label>Mes</label>
    <select id="mes">
        <option>Enero</option>
        <option>Febrero</option>
        <option>Marzo</option>
        <option>Abril</option>
        <option>Mayo</option>
        <option>Junio</option>
        <option>Julio</option>
        <option>Agosto</option>
        <option>Septiembre</option>
        <option>Octubre</option>
        <option>Noviembre</option>
        <option>Diciembre</option>
    </select>

    <label>Lista de Números de Teléfono (uno por línea)</label>
    <textarea id="telefonos" placeholder="70000000&#10;71111111&#10;72222222"></textarea>

    <button class="generar" onclick="generarComentarios()">Generar</button>
    <button class="copiar" onclick="copiarResultado()">Copiar</button>

    <label>Resultado</label>
    <textarea id="resultado" readonly></textarea>
</div>

<script>
function generarComentarios() {
    const empresa = document.getElementById("empresa").value.trim();
    const mes = document.getElementById("mes").value;
    const telefonos = document.getElementById("telefonos").value
        .split("\n")
        .map(t => t.trim())
        .filter(t => t !== "");

    const comentarios = telefonos.map(tel =>
        `${tel}-${empresa}-${mes}`
    );

    document.getElementById("resultado").value =
        comentarios.join("\n");
}

function copiarResultado() {
    const resultado = document.getElementById("resultado");

    resultado.select();
    resultado.setSelectionRange(0, 99999);

    navigator.clipboard.writeText(resultado.value);

    alert("Comentarios copiados al portapapeles");
}
</script>

</body>
</html>
