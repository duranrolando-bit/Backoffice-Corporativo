<h2>Firmador Automático</h2>
<p>Diseñado para el formulario de robo/extravío de Claro.</p>
<input type="file" id="pdf" accept=".pdf">
<input type="file" id="firma" accept="image/*">
<button onclick="firmar()">Firmar y descargar</button>
<script>
async function firmar(){
const pdfFile=document.getElementById('pdf').files[0];
const firmaFile=document.getElementById('firma').files[0];
if(!pdfFile||!firmaFile){alert('Seleccione PDF y firma');return;}
const pdfBytes=await pdfFile.arrayBuffer();
const imgBytes=await firmaFile.arrayBuffer();
const pdfDoc=await PDFLib.PDFDocument.load(pdfBytes);
const page=pdfDoc.getPages()[0];
const w=page.getWidth();
const h=page.getHeight();
let img;
if((firmaFile.type||'').includes('png')) img=await pdfDoc.embedPng(imgBytes);
else img=await pdfDoc.embedJpg(imgBytes);

const firmaW=w*0.22;
const firmaH=firmaW*(img.height/img.width);
const x=w*0.19;
const y=h*0.43;

// Ocultar sección "Gestor:"
page.drawRectangle({
x: w * 0.10, // Ajustar según ubicación real
y: h * 0.15, // Ajustar según ubicación real
width: w * 0.25, // Ancho del área a cubrir
height: 25,
color: PDFLib.rgb(1,1,1) // Blanco
});

// Ocultar sección "Campo de texto"
page.drawRectangle({
x: w * 0.645, // Ajustar según ubicación real
y: h * 0.578, // Ajustar según ubicación real
width: w * 0.27, // Ancho del área a cubrir
height: 28,
color: PDFLib.rgb(1,1,1) // Blanco
});

page.drawImage(img,{x,y,width:firmaW,height:firmaH});
const out=await pdfDoc.save();
const blob=new Blob([out],{type:'application/pdf'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download=pdfFile.name.replace('.pdf','')+'_firmado.pdf';
a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}
</script>
</body>
