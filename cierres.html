<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plantillas y cierres QF</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sidebar.css">
<script src="sidebar.js" defer></script>
<style>
:root{--primary:#2563eb;--success:#10b981;--danger:#ef4444;--text:#1f2937;--border:#e5e7eb;--muted:#6b7280}
*{box-sizing:border-box}
body{font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#e0e7ff,#f8fafc);min-height:100vh;color:var(--text)}
.container{max-width:1100px;margin:auto}.card{background:#fff;border-radius:20px;padding:25px;margin-bottom:22px;box-shadow:0 15px 35px rgba(0,0,0,.08)}
h1,h2{text-align:center;color:var(--text);margin:0 0 14px}h1{font-size:28px}.subtitulo{text-align:center;color:var(--muted);margin:0 0 25px;line-height:1.55}.template-title{font-size:21px;text-align:left;margin-bottom:8px}.template-description{color:var(--muted);margin:0 0 20px;font-size:14px}
.selector-card{margin-bottom:18px}.selector-card label{display:block;margin-bottom:8px;font-weight:600}.selector-card select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:#fff;color:#1f2937;font:inherit}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.input-group{display:flex;flex-direction:column;gap:6px}.input-group label{font-size:13px;color:var(--muted);font-weight:600}.input-group input,.input-group textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font:inherit;font-size:14px;background:#fff;color:#1f2937}.input-group input:focus,.input-group textarea:focus,.selector-card select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(37,99,235,.15)}.input-group textarea{min-height:100px;resize:vertical}.full{grid-column:1/-1}
.botones{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}.botones button{border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;color:#fff;transition:transform .2s,filter .2s}.botones button:hover{transform:translateY(-2px);filter:brightness(.95)}.btn-copy{background:var(--success)}.btn-qf{background:var(--primary)}.btn-clear{background:var(--danger)}[hidden]{display:none!important}
@media(max-width:600px){h1{font-size:23px}.card{padding:19px}.botones button{width:100%}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="container">
  <section class="card selector-card" aria-label="Seleccionar plantilla">
    <label for="plantilla-selector">Seleccionar plantilla</label>
    <select id="plantilla-selector">
      <option value="cierre">Cierre de Ticket QF</option>
      <option value="ticket">Ticket QF</option>
      <option value="facturacion">Facturación electrónica (FEL)</option>
      <option value="pago">Pago</option>
      <option value="falla">Reporte de falla</option>
    </select>
  </section>
  <section class="card" id="plantilla-activa" aria-live="polite"></section>
</main>
<script>
const plantillas={
  cierre:{titulo:'📋 Cierre de Ticket QF',descripcion:'Complete la información y copie la plantilla con un clic.',campos:[['Nombre de quien llama','nombre'],['ND que reporta','nd'],['Nombre de la empresa','empresa'],['SD','sd'],['F','f'],['Celular de contacto','celular'],['Correo','correo','email'],['Comentario','comentario','textarea','full'],['Número de Caso QF','casoQF','text','full']]},
  ticket:{titulo:'Plantilla de Ticket QF',descripcion:'Complete los datos del ticket y copie la plantilla completa.',campos:[['Id Ticket','ticket'],['Asunto','asunto'],['Usuario','usuario'],['QF','qf'],['Medio de contacto','medio','readonly','', 'Ticketera 360'],['Nombre de empresa','empresa'],['Nombre de quien solicita','solicitante'],['Correo','correo','email'],['ND del inconveniente','nd'],['Contactos','contactos'],['Solicita','solicitud','text','full'],['Comentario','comentario','textarea','full']]},
  facturacion:{titulo:'Plantilla de facturación electrónica',descripcion:'Complete la información relacionada con FEL y los DTE no recibidos.',campos:[['Nombre de quien llama','nombre'],['Número del que llama','numero'],['Empresa','empresa'],['ID cliente','idCliente'],['ND','nd'],['Correo electrónico FEL','correo','email'],['Tipo de documento (CCF o FCF)','tipoDocumento'],['Exento, Exportación o gravado IVA','tipoIva'],['DTE´s no recibidos','dte','textarea','full'],['Contactos','contactos','text','full'],['Comentario','comentario','textarea','full']]},
  pago:{titulo:'Plantilla de pago',descripcion:'Registre los datos del pago para copiar y compartir.',campos:[['Fecha de pago','fecha'],['Número de autorización bancaria','autorizacion'],['NPE o número de servicio','npe'],['Últimos 4 dígitos de la tarjeta utilizada','tarjeta','text','','','4'],['Monto cancelado','monto'],['Banco donde realizó el pago','banco']]},
  falla:{titulo:'Plantilla de reporte de falla',descripcion:'Complete los datos del reporte de falla para copiar la plantilla.',campos:[['Nombre','nombre'],['Teléfonos de fallas','telefonos'],['Error','error'],['Dirección específica (RR.SS. puede hacer uso de coordenadas)','direccion','textarea','full'],['Fecha de inicio de falla','fecha'],['Correo Electrónico','correo','email'],['Número de caso','caso'],['Contacto fijo u otro operador','contacto','text','full'],['Comentario','comentario','textarea','full']]}
};
const selector=document.getElementById('plantilla-selector');
const contenedor=document.getElementById('plantilla-activa');
function crearCampo(tipo,campo){
  const [etiqueta,nombre,formato='text',ancho='',valor='',maximo='']=campo;
  const grupo=document.createElement('div');grupo.className=`input-group ${ancho}`.trim();
  const id=`${tipo}-${nombre}`;const label=document.createElement('label');label.htmlFor=id;label.textContent=etiqueta;
  const input=document.createElement(formato==='textarea'?'textarea':'input');input.id=id;input.dataset.field=nombre;input.placeholder=etiqueta;
  if(formato==='email')input.type='email';if(formato==='readonly'){input.value=valor;input.readOnly=true;input.dataset.fixed='true'}if(maximo)input.maxLength=Number(maximo);
  grupo.append(label,input);return grupo;
}
function mostrarPlantilla(tipo){
  const plantilla=plantillas[tipo];contenedor.replaceChildren();
  const titulo=document.createElement(tipo==='cierre'?'h1':'h2');titulo.className=tipo==='cierre'?'':'template-title';titulo.textContent=plantilla.titulo;
  const descripcion=document.createElement('p');descripcion.className='subtitulo';descripcion.textContent=plantilla.descripcion;
  const grid=document.createElement('div');grid.className='form-grid';plantilla.campos.forEach(campo=>grid.appendChild(crearCampo(tipo,campo)));
  const botones=document.createElement('div');botones.className='botones';
  if(tipo==='cierre'){const qf=document.createElement('button');qf.type='button';qf.className='btn-qf';qf.textContent='📌 Copiar QF';qf.addEventListener('click',copiarQF);botones.append(qf)}
  const copiar=document.createElement('button');copiar.type='button';copiar.className='btn-copy';copiar.textContent='📄 Copiar Plantilla Completa';copiar.addEventListener('click',()=>copiarPlantilla(tipo));
  const limpiar=document.createElement('button');limpiar.type='button';limpiar.className='btn-clear';limpiar.textContent='🗑 Limpiar';limpiar.addEventListener('click',()=>limpiarFormulario(tipo));botones.append(copiar,limpiar);
  contenedor.append(titulo,descripcion,grid,botones);
}
function leer(tipo,campo){return contenedor.querySelector(`[data-field="${campo}"]`)?.value.trim()||''}
function obtenerTexto(tipo){
  if(tipo==='cierre')return `NOMBRE DE QUIEN LLAMA: ${leer(tipo,'nombre')}\nND QUE REPORTA: ${leer(tipo,'nd')}\nNOMBRE DE LA EMPRESA: ${leer(tipo,'empresa')}\nSD: ${leer(tipo,'sd')}\nF: ${leer(tipo,'f')}\nCELULAR DE CONTACTO: ${leer(tipo,'celular')}\nCORREO: ${leer(tipo,'correo')}\nCOMENTARIO: ${leer(tipo,'comentario')}\n\nSE PROCEDE CON CIERRE DE TICKET POR PÉRDIDA DE FLUJO QF-${leer(tipo,'casoQF')}`;
  if(tipo==='ticket')return `Id Ticket: ${leer(tipo,'ticket')}\nAsunto: ${leer(tipo,'asunto')}\nUsuario: ${leer(tipo,'usuario')}\n\nQF-${leer(tipo,'qf')}\n\nMedio de contacto: Ticketera 360\nNombre de empresa: ${leer(tipo,'empresa')}\nNombre de quien solicita: ${leer(tipo,'solicitante')}\nCorreo: ${leer(tipo,'correo')}\nND del inconveniente: ${leer(tipo,'nd')}\nContactos: ${leer(tipo,'contactos')}\nSolicita: ${leer(tipo,'solicitud')}\n\nComentario:\n${leer(tipo,'comentario')}`;
  return plantillas[tipo].campos.map(([etiqueta,campo])=>`${etiqueta}: ${leer(tipo,campo)}`).join('\n');
}
async function copiarPlantilla(tipo){const texto=obtenerTexto(tipo);try{await navigator.clipboard.writeText(texto);alert('Plantilla copiada al portapapeles.')}catch(error){const area=document.createElement('textarea');area.value=texto;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();alert('Plantilla copiada al portapapeles.')}}
function copiarQF(){const texto=`SE PROCEDE CON CIERRE DE TICKET POR PÉRDIDA DE FLUJO QF-${leer('cierre','casoQF')}`;navigator.clipboard.writeText(texto).then(()=>alert('QF copiado al portapapeles.')).catch(()=>alert(texto))}
function limpiarFormulario(tipo){contenedor.querySelectorAll('[data-field]:not([data-fixed])').forEach(campo=>campo.value='')}
selector.addEventListener('change',()=>mostrarPlantilla(selector.value));mostrarPlantilla(selector.value);
</script>
</body>
</html>
