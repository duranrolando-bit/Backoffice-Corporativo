<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cierre de Ticket QF</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --primary:#2563eb;
    --primary-hover:#1d4ed8;
    --success:#10b981;
    --danger:#ef4444;
    --bg:#f3f4f6;
    --card:#ffffff;
    --text:#1f2937;
    --border:#e5e7eb;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(135deg,#e0e7ff,#f8fafc);
    min-height:100vh;
    padding:25px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.card{
    background:var(--card);
    border-radius:20px;
    padding:25px;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    color:var(--text);
    margin-bottom:20px;
    font-size:28px;
}

.subtitulo{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

label{
    font-size:13px;
    color:#6b7280;
    margin-bottom:6px;
    font-weight:600;
}

input, textarea{
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 15px;
    font-size:14px;
    transition:.3s;
    background:white;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

textarea{
    min-height:120px;
    resize:vertical;
}

.full{
    grid-column:1/-1;
}

.botones{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:20px;
}

button{
    border:none;
    border-radius:12px;
    padding:12px 18px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
    color:white;
}

button:hover{
    transform:translateY(-2px);
}

.btn-copy{
    background:var(--success);
}

.btn-copy:hover{
    background:#059669;
}

.btn-qf{
    background:var(--primary);
}

.btn-qf:hover{
    background:var(--primary-hover);
}

.btn-clear{
    background:var(--danger);
}

.btn-clear:hover{
    background:#dc2626;
}

.preview{
    margin-top:25px;
}

.preview h3{
    margin-bottom:10px;
    color:var(--text);
}

#resultado{
    min-height:300px;
    background:#111827;
    color:#f9fafb;
    border:none;
    border-radius:15px;
    padding:20px;
    font-family:Consolas, monospace;
    line-height:1.5;
}

.toast{
    position:fixed;
    top:20px;
    right:20px;
    background:#111827;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    opacity:0;
    transform:translateY(-20px);
    transition:.3s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

@media(max-width:768px){

    h1{
        font-size:22px;
    }

    .botones button{
        width:100%;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="card">

        <h1>📋 Cierre de Ticket QF</h1>
        <p class="subtitulo">
            Complete la información y copie la plantilla con un clic.
        </p>

        <div class="form-grid">

            <div class="input-group">
                <input type="text" id="nombre" placeholder="Nombre de quien llama">
            </div>

            <div class="input-group">
                <input type="text" id="nd" placeholder="ND que reporta">
            </div>

            <div class="input-group">
                <input type="text" id="empresa" placeholder="Nombre de la empresa">
            </div>

            <div class="input-group">
                <input type="text" id="sd" placeholder="SD">
            </div>

            <div class="input-group">
                <input type="text" id="f" placeholder="F">
            </div>

            <div class="input-group">
                <input type="text" id="celular" placeholder="Celular de contacto">
            </div>

            <div class="input-group full">
                <input type="email" id="correo" placeholder="Correo">
            </div>

            <div class="input-group full">
                <label>Comentario</label>
                <textarea id="comentario" placeholder="Comentario"></textarea>
            </div>

            <div class="input-group full">
                <label>Número de Caso QF</label>
                <input type="text" id="casoQF" placeholder="Número de Caso QF">
            </div>

        </div>

        <div class="botones">
            <button class="btn-qf" onclick="copiarQF()">
                📌 Copiar QF
            </button>

            <button class="btn-copy" onclick="copiarPlantilla()">
                📄 Copiar Plantilla Completa
            </button>

            <button class="btn-clear" onclick="limpiarFormulario()">
                🗑 Limpiar
            </button>
        </div>

        <div class="preview">
            <h3>Vista Previa</h3>

            <textarea id="resultado" readonly></textarea>
        </div>

    </div>

</div>

<div class="toast" id="toast"></div>

<script>

const campos = document.querySelectorAll("input, textarea");

campos.forEach(campo=>{
    campo.addEventListener("input", actualizarPreview);
});

function actualizarPreview(){

const texto =
`NOMBRE DE QUIEN LLAMA: ${document.getElementById("nombre").value}
ND QUE REPORTA: ${document.getElementById("nd").value}
NOMBRE DE LA EMPRESA: ${document.getElementById("empresa").value}
SD: ${document.getElementById("sd").value}
F: ${document.getElementById("f").value}
CELULAR DE CONTACTO: ${document.getElementById("celular").value}
CORREO: ${document.getElementById("correo").value}
COMENTARIO: ${document.getElementById("comentario").value}

SE PROCEDE CON CIERRE DE TICKET POR PÉRDIDA DE FLUJO QF-${document.getElementById("casoQF").value}`;

document.getElementById("resultado").value = texto;

return texto;
}

function mostrarToast(mensaje){

const toast = document.getElementById("toast");

toast.textContent = mensaje;
toast.classList.add("show");

setTimeout(()=>{
   ;
},2000);

}

function copiarQF(){

const texto = "SE PROCEDE CON CIERRE DE TICKET POR PÉRDIDA DE FLUJO QF-" + document.getElementById("casoQF").value;

navigator.clipboard.writeText(texto);

mostrarToast("✅ QF copiado");
}

function copiarPlantilla(){

navigator.clipboard.writeText(actualizarPreview());

mostrarToast("✅ Plantilla copiada");
}

function limpiarFormulario(){

document.querySelectorAll("input, textarea").forEach(campo=>{

if(campo.id !== "resultado"){
campo.value="";
}

});

actualizarPreview();

mostrarToast("🗑 Formulario limpiado");
}

actualizarPreview();

</script>

</body>
</html>
