<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloc de Notas</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:15px;
}

h1{
    color:#333;
}

.top-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

button{
    border:none;
    border-radius:10px;
    padding:10px 15px;
    cursor:pointer;
    font-weight:600;
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
}

.btn-primary{
    background:#4f46e5;
    color:white;
}

.btn-success{
    background:#10b981;
    color:white;
}

.btn-danger{
    background:#ef4444;
    color:white;
}

.tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:15px;
    padding-bottom:5px;
}

.tab{
    padding:10px 15px;
    background:#e5e7eb;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
}

.tab.active{
    background:#4f46e5;
    color:white;
}

textarea{
    width:100%;
    height:65vh;
    border:none;
    outline:none;
    resize:none;
    padding:15px;
    border-radius:12px;
    background:#f5f7fa;
    font-size:16px;
    line-height:1.6;
}

.footer{
    margin-top:15px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
}

.counter{
    color:#666;
}

@media(max-width:768px){

    textarea{
        height:60vh;
    }

    .footer{
        flex-direction:column;
    }
}

.mini-timer{
    width:90px;
    text-align:center;
    background:#000000;
    color:rgb(0, 255, 0);
    font-weight:bold;
    padding:8px;
    border-radius:10px;
    cursor:pointer;
    user-select:none;
    margin-bottom:15px;
    box-shadow:0 3px 8px rgba(0,0,0,.2);
}

.mini-timer.running{
    background:#dc2626;
}

.mini-timer.finished{
    background:#16a34a;
}
</style>
</head>
<body>

<div class="container">

<header>
    <h1>📝 Bloc de Notas</h1>

    <div class="top-buttons">
        <button class="btn-primary" onclick="newNote()">➕ Nueva Nota</button>
        <button class="btn-success" onclick="downloadNote()">📥 Descargar</button>
        <button class="btn-danger" onclick="deleteNote()">🗑 Eliminar</button>
    </div>
</header>

<div class="tabs" id="tabs"></div>

<div class="mini-timer" id="timerBtn">
    ⏱ 1:45
</div>

<textarea id="editor" placeholder="Escribe aquí..."></textarea>

<div class="footer">
    <div class="counter">
        Caracteres: <span id="count">0</span>
    </div>

    <button class="btn-primary" onclick="renameNote()">
        ✏ Renombrar Nota
    </button>
</div>

</div>

<script>

let notes = JSON.parse(localStorage.getItem("notesTabs")) || [
    {
        id: Date.now(),
        title: "Nota 1",
        content: ""
    }
];

let activeIndex = 0;

const editor = document.getElementById("editor");
const tabs = document.getElementById("tabs");
const count = document.getElementById("count");

function saveData(){
    localStorage.setItem(
        "notesTabs",
        JSON.stringify(notes)
    );
}

function renderTabs(){

    tabs.innerHTML="";

    notes.forEach((note,index)=>{

        const tab=document.createElement("div");

        tab.className=
            "tab"+
            (index===activeIndex ? " active":"");

        tab.textContent=note.title;

        tab.onclick=()=>{
            activeIndex=index;
            loadNote();
        };

        tabs.appendChild(tab);

    });
}

function loadNote(){

    editor.value=notes[activeIndex].content;

    renderTabs();
    updateCounter();
}

function updateCounter(){
    count.textContent=editor.value.length;
}

editor.addEventListener("input",()=>{

    notes[activeIndex].content=
        editor.value;

    saveData();
    updateCounter();

});

function newNote(){

    const title=
        prompt("Nombre de la nueva nota:");

    if(!title) return;

    notes.push({
        id:Date.now(),
        title:title,
        content:""
    });

    activeIndex=
        notes.length-1;

    saveData();
    loadNote();
}

function renameNote(){

    const current=
        notes[activeIndex].title;

    const newName=
        prompt("Nuevo nombre:",current);

    if(!newName) return;

    notes[activeIndex].title=
        newName;

    saveData();
    renderTabs();
}

function deleteNote(){

    if(notes.length===1){
        alert(
          "Debe existir al menos una nota."
        );
        return;
    }

    if(
      confirm(
      "¿Eliminar esta nota?"
      )
    ){

        notes.splice(
            activeIndex,
            1
        );

        activeIndex=0;

        saveData();
        loadNote();
    }
}

function downloadNote(){

    const note=
        notes[activeIndex];

    const blob=
        new Blob(
            [note.content],
            {type:"text/plain"}
        );

    const link=
        document.createElement("a");

    link.href=
        URL.createObjectURL(blob);

    link.download=
        note.title + ".txt";

    link.click();

    URL.revokeObjectURL(
        link.href
    );
}

loadNote();

const timerBtn = document.getElementById("timerBtn");

const INITIAL_SECONDS = 105; // 1:45

let remainingSeconds = INITIAL_SECONDS;
let timerRunning = false;
let timerInterval = null;

function formatTime(seconds){

    const min = Math.floor(seconds / 60);
    const sec = seconds % 60;

    return `${min}:${sec.toString().padStart(2,"0")}`;
}

function updateTimerUI(){

    timerBtn.textContent =
        "⏱ " + formatTime(remainingSeconds);
}

timerBtn.addEventListener("click",()=>{

    if(!timerRunning){

        timerRunning = true;

        timerBtn.classList.add("running");

        timerInterval = setInterval(()=>{

            remainingSeconds--;

            updateTimerUI();

            if(remainingSeconds <= 0){

                clearInterval(timerInterval);

                timerRunning = false;

                timerBtn.classList.remove("running");
                timerBtn.classList.add("finished");

                timerBtn.textContent = "✅ 0:00";

                alert("Tiempo finalizado");
            }

        },1000);

    }else{

        clearInterval(timerInterval);

        timerRunning = false;

        remainingSeconds = INITIAL_SECONDS;

        timerBtn.classList.remove("running");
        timerBtn.classList.remove("finished");

        updateTimerUI();
    }

});

updateTimerUI();

</script>

</body>
</html>
